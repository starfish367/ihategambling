name: Automated Gambling Crawler

on:
  schedule:
    # Chay tu dong moi 6 tieng mot lan (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Cho phep bam nut chay thu cong tren giao dien GitHub
    inputs:
      threads:
        description: 'So luong bot chay song song'
        required: false
        default: '16'
      minutes:
        description: 'Thoi gian chay (phut)'
        required: false
        default: '15'

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Crawler Bots
        run: |
          THREADS="${{ github.event.inputs.threads || '16' }}"
          MINUTES="${{ github.event.inputs.minutes || '15' }}"
          echo "Khoi chay $THREADS bot trong $MINUTES phut tren GitHub Runner..."
          python gambling-crawler.py --threads "$THREADS" --minutes "$MINUTES" --output suspicious_domains.txt

      - name: Commit and push newly discovered domains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add suspicious_domains.txt
          if git diff-index --quiet HEAD; then
            echo "Khong co domain moi nao duoc phat hien."
          else
            git commit -m "chore(auto): update suspicious domains [skip ci]"
            git push
            echo "Da day danh sach domain moi len repository thanh cong."
          fi
